<!--
  Caiçara · Body — Página: Início (/)
  Cole em: Pages → Home → Custom Code → "Body HTML"
  ──────────────────────────────────────────────────────────────────────
  A página é montada pelo site.js (carregado no site-wide HEADER).
  O atributo data-page identifica qual componente renderizar.
  O atributo data-base aponta para a versão pinada do repo no jsDelivr.
-->
<header id="caicara-nav" aria-label="Navegação do site"></header>
<main id="caicara-main" tabindex="-1">
  <div id="caicara-page" data-page="home" data-base="https://cdn.jsdelivr.net/gh/mhprol/caicara-site@v1.0.6"></div>
</main>
